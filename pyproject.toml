[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["**/__pycache__", "**/*.ipynb"]

[tool.ruff.lint]
ignore = [
    "RUF001",  # intentional Chinese text
    "RUF002",  # intentional mathematical notation
    "RUF003",  # intentional explanatory comments
]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "PIE",
    "PERF",
    "RET",
    "RUF",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = [
    "TsMetrics/tests",
    "TsModels/tests",
    "TsPlots/tests",
    "TsSims/tests",
    "TsTests/tests",
    "TsUtils/tests",
]

[tool.coverage.run]
branch = true
source = ["TsSims", "TsTests"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]