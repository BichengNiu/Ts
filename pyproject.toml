[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "PIE",
    "PERF",
    "RET",
    "RUF",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = [
    "TsMetrics/tests",
    "TsModels/tests",
    "TsPlots/tests",
    "TsSims/tests",
    "TsTests/tests",
    "TsUtils/tests",
]
